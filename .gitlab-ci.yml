stages: [test, deploy]

# LC corona batch runner (1 node) — mirrors the dftracer .corona-batch convention.
.corona-batch:
  id_tokens:
    SITE_ID_TOKEN:
      aud: https://lc.llnl.gov/gitlab
  tags: [batch, corona]
  variables:
    PYTHON_MODULE: python/3.13.2
    GCC_MODULE: gcc/11.2.1
    SMALL_QUEUE: pdebug
    SMALL_QUEUE_WALLTIME: 60
    SCHEDULER_PARAMETERS: "-N 1 -q $SMALL_QUEUE -t $SMALL_QUEUE_WALLTIME"

# Converted from .github/workflows/ci.yml (build-and-test).
# NOTE(gitlab-migration): the GitHub matrix (ubuntu-22.04 x python 3.10/3.11/3.12,
# via astral-sh/setup-uv) is collapsed to the single LC module toolchain
# ($PYTHON_MODULE) with a plain venv + pip instead of uv/docker.
build-and-test:
  extends: .corona-batch
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - module load $PYTHON_MODULE
    - python3 -m venv .venv && source .venv/bin/activate
  script:
    - pip install -e ".[streaming]" pytest
    - pytest -v tests/
    # Offline findings replay smoke test (same command as the GitHub workflow).
    - DFOPTIMIZER_BOOTSTRAP_DLIO=1 python main.py
        --transport file
        --findings-file "$CI_PROJECT_DIR/tests/data/findings.jsonl"

pages:
  extends: .corona-batch
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "gitlab-migration"'  # temporary: remove after merge to main
  before_script:
    - module load $PYTHON_MODULE
    - python3 -m venv .venv-docs && source .venv-docs/bin/activate
  script:
    - pip install -r docs/requirements.txt
    - sphinx-build -b html docs public
  artifacts:
    paths: [public]
