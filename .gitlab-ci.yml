stages: [alloc, test, deploy, cleanup]

# LC corona CI via a single shared Flux allocation:
#  - `allocate` creates ONE 1-node allocation and saves its Flux job id to
#    .flux-jobid (artifact) so ALL jobs in the pipeline share it globally.
#  - every CI job reads the id and runs its steps via `flux proxy <jobid>`.
#  - `release-allocation` cancels it at the end (runs even on failure).
.corona-flux:
  id_tokens:
    SITE_ID_TOKEN:
      aud: https://lc.llnl.gov/gitlab
  tags: [shell, corona]
  variables:
    PYTHON_MODULE: python/3.13.2
    COMPILER_MODULE: gcc/11.2.1
    SMALL_QUEUE: pdebug
    SMALL_QUEUE_WALLTIME: 60

allocate:
  extends: .corona-flux
  stage: alloc
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - flux batch -N 1 -q "$SMALL_QUEUE" -t "${SMALL_QUEUE_WALLTIME}m" --job-name=dfoptimizer-ci --wrap sleep inf
    - JOBID=$(flux job last)
    - echo "$JOBID" > .flux-jobid
    - echo "Created Flux allocation $JOBID (shared by all CI jobs)"
    # No timeout: batch queues may take long to schedule the allocation.
    - flux job wait-event "$JOBID" start
  artifacts:
    paths: [.flux-jobid]

# Converted from .github/workflows/ci.yml (build-and-test).
# NOTE(gitlab-migration): the GitHub matrix (ubuntu-22.04 x python 3.10/3.11/3.12,
# via astral-sh/setup-uv) is collapsed to the single LC module toolchain
# ($PYTHON_MODULE) with a plain venv + pip instead of uv/docker.
# One allocation; tests + docs both run on it via flux proxy.
build-and-test:
  extends: .corona-flux
  stage: test
  needs: [allocate]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - JOBID=$(cat .flux-jobid)
    - flux proxy "$JOBID" bash -lc "module load $PYTHON_MODULE && python3 -m venv .venv && source .venv/bin/activate && pip install -e '.[streaming]' pytest"
    - flux proxy "$JOBID" bash -lc "source .venv/bin/activate && pytest -v tests/"
    # Offline findings replay smoke test (same command as the GitHub workflow).
    - flux proxy "$JOBID" bash -lc "source .venv/bin/activate && DFOPTIMIZER_BOOTSTRAP_DLIO=1 python main.py --transport file --findings-file \"$CI_PROJECT_DIR/tests/data/findings.jsonl\""
    # Docs build (published by the pages job below from this artifact).
    - flux proxy "$JOBID" bash -lc "module load $PYTHON_MODULE && python3 -m venv .venv-docs && source .venv-docs/bin/activate && pip install -r docs/requirements.txt && sphinx-build -b html docs public"
  artifacts:
    paths: [public]

# Publishes the artifact from build-and-test — shell runner, no allocation.
pages:
  extends: .corona-flux
  stage: deploy
  needs: [build-and-test]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "gitlab-migration"'  # temporary: remove after merge to main
  script:
    - echo "Publishing docs built by build-and-test"
  artifacts:
    paths: [public]

release-allocation:
  extends: .corona-flux
  stage: cleanup
  needs: [allocate, build-and-test]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
  script:
    - flux cancel "$(cat .flux-jobid)" || true
